name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Khong co unit test: gallery la noi kiem tra bang mat. Build chan loi chi lo
  # ra luc bundle (import vong, asset thieu); `pnpm e2e` tu build, bat vite
  # preview va chay smoke.
  check:
    uses: nguyenhuy158/kit/.github/workflows/check.yml@v0.1.0
    with:
      run-build: true
      run-e2e: true
